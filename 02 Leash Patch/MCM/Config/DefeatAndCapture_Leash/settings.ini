; Defeat and Capture - Leash Patch - setting defaults.
;
; Do not edit this file. It ships with the patch and an update will overwrite it.
;
; To change settings, use the MCM. MCM Helper writes your choices to
;   Data/MCM/Settings/DefeatAndCapture_Leash.ini
; which overrides everything here, lives outside your save, and carries across to
; a new character. Copy and ship that file to preconfigure the patch.
;
; iMode    0 = held by your captor, 1 = tied off where you were taken
; iCollar  0 = body rope (slot 58, safe alongside Devious Devices)
;          1 = neck rope, 2 = neck chain, 3 = runic collar  (all slot 45)
; fSlack   percent of the leash length you can move inside freely before the
;          rope pulls. Clamped to 10-95 in script whatever is written here.

[General]
bEnabled=1
iMode=0
fMaxLength=400
iCollar=0
fSlack=60
