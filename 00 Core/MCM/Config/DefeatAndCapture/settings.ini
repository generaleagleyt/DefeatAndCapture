; Defeat and Capture - setting defaults.
;
; Do not edit this file. It ships with the mod and an update will overwrite it.
;
; To change settings, use the MCM. MCM Helper writes your choices to
;   Data/MCM/Settings/DefeatAndCapture.ini
; which overrides everything here, lives outside your save, and therefore carries
; across to a new character.
;
; To PRECONFIGURE this mod - for a modlist, a shared preset, or your own
; "my settings" mod - copy that file, edit it, and ship it. It is a plain INI and
; every key it can contain is listed below.
;
; Five MCM controls are deliberately absent, because they are not settings:
; "Currently captured" is live state, and "Manage allies", "Forget all allies",
; "Stop holding allies in place" and "Give back what was taken" are buttons that
; do something once. Those still read and write their GlobalVariable directly.

[General]
bModEnabled=1
iTriggerMode=1
fHealthTrigger=0
bManageBleedout=1
fRecoverHealth=50
fSearchRadius=3000
bHumanoidOnly=1
bStripItems=1
bLeashEnabled=0
fLeashDistance=2500
fReleaseAfterHours=0
iSurrenderKey=0
bKeepFriends=0
bMarkAllyOn=0
bAllyReturnsGear=1
iFollowerMode=0

[Adult]
bRestraints=0

[Compat]
bAdoptKidnap=0
bShowDebug=1

[Experimental]
bSellOnTimeout=0
