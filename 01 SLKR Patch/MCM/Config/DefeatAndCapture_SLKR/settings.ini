; Defeat and Capture - SLKR Patch - setting defaults.
;
; Do not edit this file. It ships with the patch and an update will overwrite it.
;
; To change settings, use the MCM. MCM Helper writes your choices to
;   Data/MCM/Settings/DefeatAndCapture_SLKR.ini
; which overrides everything here, lives outside your save, and carries across to
; a new character.
;
; To PRECONFIGURE the patch - for a modlist, a shared preset, or your own
; "my settings" mod - copy that file, edit it, and ship it. Every key it can
; contain is listed below.
;
; [Creatures] is one key per OStim-supported creature type: 1 = that type may
; start a scene while you are held, 0 = it is skipped entirely. All 0 by default.
; [Scenes] bDDMaleFilter and fDDMax do nothing unless SL Kidnapped Redux's own
; Devious Devices option is enabled in ITS menu.
[Scenes]
bSkipScenes=0
bPlayerOnlyScenes=0
bDDMaleFilter=1
fDDMax=3

